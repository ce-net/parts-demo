<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070807">
<title>Parts inventory</title>
<link rel="icon" href="data:,">
<script>try{if(localStorage.getItem("ce-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<style>
/* ce-design tokens: the Twinton observatory look, the ce-net standard for every page and screen.
   Source: maps.ce-net.com (repo maps-ce-net, site/index.html, commits a8165d8 227617e f4930e9 a638396).
   Leif approved it as the standard 2026-10-25 12:34 CST. Dark is the default; light only by the person's switch
   (data-theme="light", remembered in localStorage "ce-theme"). Same variable names as the old ce-design sheet,
   so pages that already use them pick up the new look; maps-style aliases (--bg --dim --faint --f --disp) included. */
@font-face{font-family:Geist;font-weight:100 900;font-display:swap;
  src:url(https://ce-net.com/assets/fonts/g-geist-v5-gyByhwUxId8gMEwcGFU.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400 600;font-display:swap;
  src:url(https://ce-net.com/assets/fonts/g-jetbrainsmono-v24-tDbv2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKwBNntkaToggR7BYRbKPxDcwg.woff2) format("woff2"),
      url(https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbv2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKwBNntkaToggR7BYRbKPxDcwg.woff2) format("woff2")}
@font-face{font-family:Michroma;font-weight:400;font-display:swap;
  src:url(/fonts/michroma.woff2) format("woff2"),
      url(https://fonts.gstatic.com/s/michroma/v21/PN_zRfy9qWD8fEagAPg9pTk.woff2) format("woff2")}

:root{color-scheme:dark;
  /* neutrals: the black stage (dark, the default) */
  --ground:#070807;--surface:#0d0f0d;--well:#141614;--raise:#1c1f1c;
  --panel:rgba(10,12,10,.78);              /* glass card fill, always with --blur */
  --ink:#f2f3ef;--ink-2:#8a8f87;--ink-3:#5d625b;
  --line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.14);
  --hover:rgba(255,255,255,.04);--press:rgba(255,255,255,.08);
  /* one accent: Twinton amber */
  --acc:#f5a524;--acc-hi:#ffc35a;--acc-ink:#130d00;--acc-soft:rgba(245,165,36,.14);
  /* states (never decoration). --live is the green dot / good / saved */
  --live:#9bd16b;--ok:#9bd16b;--warn:#ffc35a;--bad:#ef4444;
  /* the stage: kept for pages that used it; it is now the ground itself */
  --stage:#070807;--stage-2:#0d0f0d;--stage-ink:#f2f3ef;--stage-ink-2:#8a8f87;--stage-line:rgba(255,255,255,.10);
  /* type: Michroma display, Geist body, JetBrains Mono labels and figures */
  --cjk:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --sans:Geist,Inter,system-ui,-apple-system,var(--cjk),sans-serif;
  --mono:"JetBrains Mono","Geist Mono",ui-monospace,SFMono-Regular,Menlo,var(--cjk),monospace;
  --disp:Michroma,Orbitron,system-ui,var(--cjk),sans-serif;
  --t-2xs:9.5px;--t-xs:10.5px;--t-sm:12px;--t-md:13px;--t-base:15px;--t-lg:clamp(15px,1.4vw,17px);
  --t-num:21px;--t-xl:clamp(19px,2.4vw,27px);--t-2xl:clamp(26px,3.4vw,40px);--t-3xl:clamp(32px,4.4vw,56px);
  --track-label:.12em;--track-crumb:.18em;--track-disp:.06em;
  /* space: 4 px base */
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;--s-7:48px;--s-8:72px;
  --m:clamp(16px,3vw,40px);--max:1120px;--rail:64px;
  /* shape: square, technical. Cards 3 px, buttons and pills 2 px */
  --r:3px;--r-sm:2px;--r-pill:2px;--tick:8px;
  --blur:blur(10px);
  --edge:0 0 0 1px var(--line);--lift:0 18px 40px -18px rgba(0,0,0,.8);
  /* motion: values tick up, cards fade in 150 ms, nothing bounces */
  --ease:cubic-bezier(.2,.7,.1,1);--fast:.15s;--mid:.25s;--slow:.6s;
  /* maps.ce-net.com aliases */
  --bg:var(--ground);--s1:var(--surface);--s2:var(--well);--s3:var(--raise);
  --dim:var(--ink-2);--faint:var(--ink-3);--f:var(--sans)}

:root[data-theme="light"]{color-scheme:light;
  --ground:#f2f2ee;--surface:#ffffff;--well:#e8e8e3;--raise:#f7f7f4;
  --panel:rgba(255,255,255,.82);
  --ink:#0d0f0d;--ink-2:#5d625b;--ink-3:#8a8f87;
  --line:rgba(13,15,13,.12);--line-2:rgba(13,15,13,.2);
  --hover:rgba(13,15,13,.04);--press:rgba(13,15,13,.07);
  --acc:#b8730a;--acc-hi:#d98a10;--acc-ink:#ffffff;--acc-soft:rgba(184,115,10,.12);
  --live:#3f8f2a;--ok:#3f8f2a;--warn:#b8730a;--bad:#dc2626;
  --lift:0 18px 40px -22px rgba(13,15,13,.25)}

/* ce-design components: the Twinton observatory pieces, lifted from maps.ce-net.com (site/index.html #obs, .tw-card,
   .tw-ring, #rail, #live, #clock, header .tools, #liveline). Load after tokens.css. Every class is token driven, so the
   light switch (data-theme="light") works without extra rules. */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 var(--t-base)/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1px solid var(--acc);outline-offset:2px}

/* glass: near-black card over the stage, hairline border, square corners */
.glass{position:relative;background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:var(--r)}

/* ticks: amber L-marks on the top-left and bottom-right corners of a featured card */
.ticks::before,.ticks::after{content:"";position:absolute;width:var(--tick);height:var(--tick);border:1px solid var(--acc);pointer-events:none}
.ticks::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.ticks::after{right:-1px;bottom:-1px;border-left:0;border-top:0}

/* crumb: TWINTON / WORLD / LIVE, current level in amber */
.crumb{font:500 10px var(--mono);letter-spacing:var(--track-crumb);color:var(--ink-2);text-transform:uppercase}
.crumb b{color:var(--acc);font-weight:500}

/* display: the wide caps headline with a full stop (PLANET OBSERVATORY.) */
.display{margin:6px 0 12px;font:400 var(--t-xl)/1.15 var(--disp);letter-spacing:var(--track-disp);text-transform:uppercase;color:var(--ink)}
.display.lg{font-size:var(--t-2xl)}.display.xl{font-size:var(--t-3xl)}
.display.over{text-shadow:0 2px 18px rgba(0,0,0,.7)}  /* when it floats over imagery */
:root[data-theme="light"] .display.over,:root[data-theme="light"] .headline{text-shadow:none}

/* headline: the top-centre title over the stage (THE WORLD'S LOGISTICS, LIVE) + a mono readout line */
.headline{text-align:center}
.headline b{display:block;font:400 15px/1.3 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.headline span{font:400 11px var(--mono);letter-spacing:.04em;color:var(--ink-2)}

/* label: small caps over a number; the dot is amber, .g green */
.label{font:500 var(--t-2xs) var(--sans);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.label i{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}
.label i.g{background:var(--live)}.label i.r{background:var(--bad)}

/* stat card: label, big mono figure (amber for the hero), muted unit, faint mono sub line */
.stat{padding:10px 11px 9px}
.num{margin-top:6px;font:500 var(--t-num)/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.num.acc{color:var(--acc)}
.num small{font-size:10px;color:var(--ink-2);margin-left:4px;font-weight:400}
.sub{margin-top:5px;font:400 10px var(--mono);color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat.has-ring{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:6px}
.stat.has-ring>div{min-width:0}

/* ring: 34 px gauge. r=15, circumference 94.25; set stroke-dashoffset = 94.25 * (1 - value) */
.ring{width:34px;height:34px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--acc);stroke-linecap:butt;transition:stroke-dashoffset .6s ease-out}
.ring.g .fg{stroke:var(--live)}

/* pills: segmented time range (Now / 24 hours / 7 days / 30 days); selected = lighter fill + amber underline */
.pills{display:inline-flex;gap:0;border:1px solid var(--line);background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:var(--r);padding:2px}
.pills button{background:none;border:0;color:var(--ink-2);font:500 10.5px var(--mono);letter-spacing:.08em;padding:6px 10px;border-radius:var(--r-sm);cursor:pointer}
.pills button:hover{color:var(--ink)}
.pills button[aria-pressed=true]{background:var(--press);color:var(--ink);box-shadow:inset 0 -1px 0 var(--acc)}

/* rail: left icon nav (Overview / Layers / Twins / Cells); active = lighter fill + 2 px amber bar on the left edge */
.rail{position:fixed;left:0;top:56px;bottom:56px;width:var(--rail);display:flex;flex-direction:column;gap:2px;padding:8px 6px;
  background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-left:0;border-radius:0 var(--r) var(--r) 0;z-index:20}
.rail button,.rail a{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;border-radius:var(--r-sm);color:var(--ink-2);
  padding:9px 2px;cursor:pointer;font:500 8.5px var(--sans);letter-spacing:var(--track-label);text-transform:uppercase;text-decoration:none;position:relative}
.rail svg{width:17px;height:17px}
.rail button:hover,.rail a:hover{color:var(--ink);background:var(--hover)}
.rail [aria-pressed=true],.rail [aria-current=page]{color:var(--ink);background:var(--press)}
.rail [aria-pressed=true]::before,.rail [aria-current=page]::before{content:"";position:absolute;left:-6px;top:8px;bottom:8px;width:2px;background:var(--acc)}
.rail.static{position:sticky;top:0;height:100dvh;border-radius:0}
@media (max-width:600px){
  .rail{top:auto;bottom:0;left:0;right:0;width:auto;height:54px;flex-direction:row;justify-content:space-around;
    padding:4px 8px calc(4px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line);border-radius:0}
  .rail button,.rail a{flex:1;padding:6px 2px}
  .rail [aria-pressed=true]::before,.rail [aria-current=page]::before{left:20%;right:20%;top:-4px;bottom:auto;width:auto;height:2px}
  .rail.static{position:fixed;height:54px}}

/* btn: top-right caps buttons in one glass group (ADD YOUR TWIN, CELLS 5) */
.btns{display:flex;gap:2px;padding:3px}
.btn{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--ink);border:0;border-radius:var(--r-sm);padding:6px 10px;
  font:500 10.5px var(--sans);letter-spacing:var(--track-label);text-transform:uppercase;text-decoration:none;white-space:nowrap;cursor:pointer;
  transition:background var(--fast) var(--ease),transform .14s var(--ease)}
.btn:hover{background:var(--press)}.btn:active{transform:scale(.97)}
.btn.quiet{color:var(--ink-2)}.btn.quiet:hover{color:var(--ink)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn .cnt{background:var(--acc);color:var(--acc-ink);border-radius:var(--r-sm);padding:0 5px;font:600 10px var(--mono);letter-spacing:0}
.btn kbd{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 4px;font:500 10px var(--mono);color:var(--ink-2)}

/* chips: bottom bar of layers with coloured dots and mono counts; off = grey dot, nodata = faded */
.chips{display:flex;gap:4px;padding:4px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;background:none;border:0;border-radius:var(--r-sm);
  color:var(--ink-2);padding:7px 11px;cursor:pointer;font:500 10.5px var(--sans);letter-spacing:var(--track-label);text-transform:uppercase}
.chips button i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);opacity:.6}
.chips button small{font:500 10px var(--mono);letter-spacing:0;color:var(--ink-2)}
.chips button.on{color:var(--ink);background:var(--press)}
.chips button.on i{background:var(--acc);opacity:1}
.chips button.on i.g{background:var(--live)}
.chips button.nodata{opacity:.45}

/* scrub: timeline card. Step buttons, amber mono clock, red LIVE dot, amber range, tick scale */
.scrub{display:flex;flex-direction:column;gap:2px;padding:6px 8px 4px;width:min(480px,100%)}
.scrub .row{display:flex;align-items:center;gap:2px}
.scrub .k{background:none;border:0;color:var(--ink-2);min-width:30px;height:30px;border-radius:var(--r-sm);cursor:pointer;display:grid;place-items:center;
  font:500 10.5px var(--sans);letter-spacing:var(--track-label);text-transform:uppercase}
.scrub .k:hover{background:var(--press);color:var(--ink)}
.scrub .k svg{width:12px;height:12px;fill:currentColor}
.scrub .read{flex:1;min-width:0;text-align:center;line-height:1.2}
.scrub .read b{display:block;font:500 11.5px var(--mono);letter-spacing:-.02em;color:var(--acc);white-space:nowrap}
.scrub .read small{font:500 9.5px var(--sans);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-2)}
.scrub .live{display:flex;gap:5px;align-items:center;padding:0 8px}
.scrub .live i{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:ce-pulse 2s infinite}
.scrub input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0 0}
.scrub .scale{display:flex;justify-content:space-between;font:400 9px var(--mono);color:var(--ink-3);padding:0 2px 2px}
@keyframes ce-pulse{50%{opacity:.35}}

/* zoom: the round-cornered square icon stack on the right edge */
.zoom{display:flex;flex-direction:column}
.zoom button{width:30px;height:30px;display:grid;place-items:center;background:none;border:0;color:var(--ink-2);cursor:pointer}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{color:var(--ink);background:var(--hover)}

/* credits: the one-line data source footer */
.credits{font:400 9.5px var(--sans);color:var(--ink-3)}

.fade-in{animation:ce-in var(--fast) ease-out both}
@keyframes ce-in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade-in,.scrub .live i{animation:none}.ring .fg{transition:none}}


/* the parts page: rail + crumb + display + glass cards (ce-design section 2, a page without a stage) */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100dvh}
.rail.static{border-right:1px solid var(--line);border-top:0;border-bottom:0;border-left:0}
main{padding:22px var(--m) 40px 24px;max-width:1180px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.link{display:inline-flex;align-items:center;gap:6px;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:6px 10px}
.link i{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.link[data-s=live] i{background:var(--live)}.link[data-s=offline] i{background:var(--bad)}
.lede{margin:-4px 0 14px;font:400 10.5px var(--mono);color:var(--ink-2)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
.stats{margin-bottom:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);transition:background-color .7s ease-out}
.row:last-child{border-bottom:0}
.row .nm{font:500 13px var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font:400 10px var(--mono);color:var(--ink-3);margin-top:2px}
.row .bin{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--ink-2)}
.row.flash{background:var(--acc-soft);transition:none}
.qty{display:flex;align-items:center;gap:2px}
.qty output{min-width:52px;text-align:right;font:500 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);padding-right:6px}
.qty output.low{color:var(--acc)}
.step{width:30px;height:30px;display:grid;place-items:center;background:var(--well);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);font:500 14px var(--mono);cursor:pointer}
.step:hover{background:var(--raise)}
.empty{padding:22px 12px;font:400 11px var(--mono);color:var(--ink-3)}
.feed ol{list-style:none;margin:0;padding:4px 0;max-height:420px;overflow:auto}
.feed li{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:6px 12px;font:400 10.5px var(--mono);color:var(--ink-2);border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed li b{color:var(--ink);font-weight:500}
.feed li .by{color:var(--acc)}
.feed time{color:var(--ink-3)}
form.add{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px auto;gap:6px;padding:10px 12px;margin-top:12px}
.add input{background:var(--well);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 9px;font:400 12px var(--mono);min-width:0}
.add input::placeholder{color:var(--ink-3)}
.err{color:var(--bad);font:400 10.5px var(--mono);margin:8px 0 0;min-height:1em}
.theme{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail.static{display:none}
  main{padding:16px 16px 72px}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sub{display:none}
  form.add{grid-template-columns:1fr 1fr}
  form.add .btn{grid-column:1 / -1;justify-content:center;min-height:44px}
  .step{width:40px;height:40px}
}

</style>
</head>
<body>
<div class="shell">
  <nav class="rail static" aria-label="Sections">
    <button aria-pressed="true" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="4" width="14" height="5"/><rect x="3" y="11" width="14" height="5"/><path d="M8 6.5h4M8 13.5h4"/></svg>Parts</button>
  </nav>
  <main>
    <div class="top">
      <div class="crumb">ce-net / <b>Parts demo</b> / Live</div>
      <nav class="btns glass">
        <span class="link" id="link" data-s="connecting"><i></i><span>Connecting</span></span>
        <button class="btn quiet theme" id="theme" type="button">Light</button>
      </nav>
    </div>
    <h1 class="display">Parts inventory.</h1>
    <p class="lede" id="lede">Typed rows in state.store through ce-db. Changes from the command line and from this page arrive here live.</p>
    <div class="bar"><div class="pills" id="bins" role="group" aria-label="Bin"></div></div>
    <div class="stats">
      <div class="glass ticks stat"><div class="label"><i></i>Parts</div><div class="num acc" id="n-parts">0</div><div class="sub" id="s-parts">in 0 bins</div></div>
      <div class="glass stat"><div class="label"><i class="g"></i>Units</div><div class="num" id="n-units">0</div><div class="sub" id="s-units">on the shelves</div></div>
      <div class="glass stat has-ring"><div><div class="label"><i></i>Low stock</div><div class="num" id="n-low">0<small>/ 0</small></div><div class="sub">under 20 in a bin</div></div>
        <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="bg" cx="18" cy="18" r="15"/><circle class="fg" id="ring" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="94.25"/></svg></div>
    </div>
    <div class="grid">
      <section class="glass" aria-label="Parts">
        <div class="card-h"><span class="label" id="list-h">All bins</span><span class="label" id="list-n">0 rows</span></div>
        <ul class="rows" id="rows"></ul>
      </section>
      <aside class="glass feed" aria-label="Live changes">
        <div class="card-h"><span class="label"><i class="g"></i>Live changes</span><span class="label" id="feed-n">0</span></div>
        <ol id="feed"></ol>
      </aside>
    </div>
    <form class="glass add" id="add" autocomplete="off">
      <input name="name" placeholder="Name, e.g. M3x8 screw" maxlength="120" required aria-label="Name">
      <input name="bin" placeholder="Bin" maxlength="16" required aria-label="Bin">
      <input name="qty" placeholder="Qty" inputmode="numeric" pattern="[0-9]+" required aria-label="Quantity">
      <button class="btn primary" type="submit">Add part</button>
    </form>
    <p class="err" id="err" role="status"></p>
