name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CE_WIRE_GEN_ONLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: private git deps (read-only deploy keys)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CE_DEPLOY_KEYS }}
      - name: cargo test
        run: cargo test --all-targets
      - name: every load goes through ce-load (no hand-written Loading..., the error shown at once and sent to error.report)
        run: |
          cargo install --git https://github.com/Leif-Rydenfalk/ce-load --rev bacdd4b ce-load-lint --locked || cargo install --git https://github.com/Leif-Rydenfalk/ce-load --rev bacdd4b ce-load-lint
          ce-load-lint check .
      - name: regenerate the SDKs and fail on drift
        run: |
          cargo install --git https://github.com/Leif-Rydenfalk/rust-stack --rev 2d463628f491170b18f249bec13d014faf2317c7 ce-wire-gen --locked || cargo install --git https://github.com/Leif-Rydenfalk/rust-stack --rev 2d463628f491170b18f249bec13d014faf2317c7 ce-wire-gen
          ce-wire-gen --lang ts crates/parts-demo-api/src/lib.rs -o sdk/ts
          ce-wire-gen --lang ts-web crates/parts-demo-api/src/lib.rs -o sdk/ts-web
          ce-wire-gen --lang swift crates/parts-demo-api/src/lib.rs -o sdk/swift
          ce-wire-gen --records crates/parts-schema/src/lib.rs --lang ts-web -o sdk/ts-web
          ce-wire-gen --records crates/parts-schema/src/lib.rs --lang json -o schemas
          git diff --exit-code sdk/ schemas/ || (echo 'sdk/ is stale: run ce-wire-gen and commit' && exit 1)
      - name: callers of the last commit keep working (an api change without a freeze fails)
        run: ce-wire-gen check crates/parts-demo-api/src/lib.rs --base HEAD~1
